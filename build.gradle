plugins {
	id 'fabric-loom' version '1.9.3'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

group = 'com.freeforallmc.icypalw'
version = '1.0.0'

repositories {
	mavenCentral()
	maven { url 'https://maven.fabricmc.net/' }
}

dependencies {
	minecraft 'com.mojang:minecraft:26.2.3'
	mappings 'net.fabricmc:yarn:26.2.3+build.2:v2'
	modImplementation 'net.fabricmc:fabric-loader:0.16.10'
	modImplementation 'net.fabricmc.fabric-api:fabric-api:0.118.6+26.2.3'
}